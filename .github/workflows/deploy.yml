# main 브랜치에 푸시하면 자동으로 빌드해 GitHub Pages에 배포합니다.
# (Actions 탭 → Deploy to GitHub Pages → Run workflow 로 수동 실행도 가능)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 마치고, 대기 중인 이전 실행만 건너뜀
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # 저장소 경로(예: /soyul-audiometry)를 기준으로 빌드 — 저장소 이름이 바뀌어도 자동 반영
      - name: Build
        run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
